<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple E-Commerce</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5;">

  <!-- Navbar -->
  <header style="background-color: #0d6efd; padding: 1rem 2rem; color: white; display: flex; justify-content: space-between; align-items: center;">
    <h1 style="margin: 0;">ShopNow</h1>
    <nav>
      <ul style="list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0;">
        <li><a href="#" style="color: white; text-decoration: none;">Home</a></li>
        <li><a href="#" style="color: white; text-decoration: none;">Products</a></li>
        <li><a href="#" style="color: white; text-decoration: none;">Cart</a></li>
        <li><a href="#" style="color: white; text-decoration: none;">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section style="background: url('https://via.placeholder.com/1200x300') no-repeat center center/cover; color: white; padding: 4rem 2rem; text-align: center;">
    <h2 style="font-size: 2.5rem;">Discover the Best Products</h2>
    <p style="font-size: 1.2rem;">Quality items at great prices</p>
  </section>

  <!-- Products Section -->
  <section style="padding: 2rem; background-color: #fff;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Featured Products</h2>
    <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 2rem;">

      <!-- Product 1 -->
      <div style="background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1rem; text-align: center; width: 250px;">
        <img src="https://via.placeholder.com/150" alt="Product 1" style="width: 100%; height: auto; margin-bottom: 1rem;" />
        <h3>Product 1</h3>
        <p>$29.99</p>
        <button style="padding: 0.5rem 1rem; background-color: #0d6efd; color: white; border: none; border-radius: 5px; cursor: pointer;">Add to Cart</button>
      </div>

      <!-- Product 2 -->
      <div style="background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1rem; text-align: center; width: 250px;">
        <img src="https://via.placeholder.com/150" alt="Product 2" style="width: 100%; height: auto; margin-bottom: 1rem;" />
        <h3>Product 2</h3>
        <p>$49.99</p>
        <button style="padding: 0.5rem 1rem; background-color: #0d6efd; color: white; border: none; border-radius: 5px; cursor: pointer;">Add to Cart</button>
      </div>

      <!-- Product 3 -->
      <div style="background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1rem; text-align: center; width: 250px;">
        <img src="https://via.placeholder.com/150" alt="Product 3" style="width: 100%; height: auto; margin-bottom: 1rem;" />
        <h3>Product 3</h3>
        <p>$19.99</p>
        <button style="padding: 0.5rem 1rem; background-color: #0d6efd; color: white; border: none; border-radius: 5px; cursor: pointer;">Add to Cart</button>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer style="text-align: center; padding: 1rem; background-color: #0d6efd; color: white;">
    <p>&copy; 2025 ShopNow. All rights reserved.</p>
  </footer>

</body>
</html>
